name: Enable GitHub Pages

on:
  push:
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on Pages from the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
            -f "source[branch]=gh-pages" -f "source[path]=/" 2>&1 | tee result.txt || true
          gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1 | tee -a result.txt || true
      - name: Report
        run: cat result.txt
