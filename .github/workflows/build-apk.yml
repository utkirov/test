name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.BOTIR_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode release keystore (optional)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/botir.jks"
          echo "BOTIR_KEYSTORE=$RUNNER_TEMP/botir.jks" >> "$GITHUB_ENV"
      - name: Build APK, AAB and debug APK
        id: build
        continue-on-error: true
        env:
          BOTIR_KS_PASS: ${{ secrets.BOTIR_KS_PASS }}
          BOTIR_KEY_ALIAS: ${{ secrets.BOTIR_KEY_ALIAS }}
          BOTIR_KEY_PASS: ${{ secrets.BOTIR_KEY_PASS }}
        run: |
          set -o pipefail
          mkdir -p out
          gradle :app:assembleRelease :app:bundleRelease :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee out/build.log
          cp app/build/outputs/apk/release/app-release.apk out/Botir.apk
          cp app/build/outputs/bundle/release/app-release.aab out/Botir.aab
          cp app/build/outputs/apk/debug/app-debug.apk out/Botir-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: out/
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-out
          path: out/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run self-test and screenshots on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emu.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-out
          path: test-out/

  release:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-out
          path: out/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-out
          path: test-out/
      - name: Pack screenshots
        run: |
          mkdir -p test-out
          if [ -d test-out/promo ]; then (cd test-out && zip -qr ../store-graphics.zip promo); fi
          ls -la out test-out || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: botir-build-${{ github.run_number }}
          name: Botir (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            out/Botir.apk
            out/Botir.aab
            out/build.log
            test-out/selftest.txt
            test-out/crashes.txt
            test-out/logcat_run.txt
            test-out/device_title.png
            test-out/device_play.png
            store-graphics.zip
